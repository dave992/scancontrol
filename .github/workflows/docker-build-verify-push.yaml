
name: Build, Verify (Industrial CI), and Push Docker images

on:
  schedule:
    - cron: '14 3 26 * *'  # Runs at 03:14 UTC on the 26st of every month
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  organisation: davekroezen
  image_repository: scancontrol_test
  dockerfile: ./.docker/Dockerfile
  context: .

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: &matrix
        ros_distro: [jazzy, humble]
        sdk_version: [1.0.0]
        include:
          - ubuntu_version: 24.04
            ros_distro: jazzy
          - ubuntu_version: 22.04
            ros_distro: humble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          file: ${{ env.dockerfile }}
          context: ${{ env.context }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            SDK_VERSION=${{ matrix.sdk_version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix: *matrix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          file: ${{ env.dockerfile }}
          context: ${{ env.context }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            SDK_VERSION=${{ matrix.sdk_version }}
          tags: |
            local/${{ env.image_repository }}:${{ matrix.ros_distro }}-sdk_v${{ matrix.sdk_version }}
          push: false
          load: true
          cache-from: type=gha
      
      - name: Build ROS package
        uses: ros-industrial/industrial_ci@master
        env:
          DOCKER_IMAGE: local/${{ env.image_repository }}:${{ matrix.ros_distro }}-sdk_v${{ matrix.sdk_version }}
          DOCKER_PULL: false

  push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: *matrix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set date
        id: date
        run: echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          file: ${{ env.dockerfile }}
          context: ${{ env.context }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            SDK_VERSION=${{ matrix.sdk_version }}
          tags: |
            ${{ env.organisation }}/${{ env.image_repository }}:${{ matrix.ros_distro }}-sdk_v${{ matrix.sdk_version }}-latest
            ${{ env.organisation }}/${{ env.image_repository }}:${{ matrix.ros_distro }}-sdk_v${{ matrix.sdk_version }}-${{ steps.date.outputs.BUILD_DATE }}
          push: true
          cache-from: type=gha
